name: Deploy PWA

on:
  push:
    branches: [master]
    paths:
      - 'kasilmu-pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-pwa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kasilmu-pwa/package-lock.json

      - name: Install dependencies
        working-directory: kasilmu-pwa
        run: npm ci

      - name: Build (production API URL)
        working-directory: kasilmu-pwa
        run: |
          echo "VITE_API_URL=https://api.kasilmu.com/api" > .env.production
          npm run build

      - name: Package build
        working-directory: kasilmu-pwa/dist
        run: tar czf ../../pwa-deploy.tar.gz .

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload build
        run: |
          scp -P "${{ secrets.SSH_PORT }}" pwa-deploy.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/pwa-deploy.tar.gz"

      - name: Extract build on server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            tar xzf ~/pwa-deploy.tar.gz -C ~/public_html
            rm ~/pwa-deploy.tar.gz
          '
